# 기존 API7 Control Plane과 FinLab 앱이 실행된 다음 사용하는 별도 DP입니다.
# 실행: python3 scripts/setup-api7.py --apply --start
# FinLab의 유일한 Gateway입니다. 기존 API7 default 그룹은 FinLab 외의 별도 설치입니다.
name: finlab-api7
services:
  gateway:
    image: api7/api7-ee-3-gateway:3.10.2
    container_name: finlab-api7-gateway
    env_file: ./.local/api7/gateway.env
    ports: ["127.0.0.1:18090:9080"]
    volumes:
      - ./infra/api7/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./.local/api7/apisix.uid:/usr/local/apisix/conf/apisix.uid
    networks: [control, applications, legacy_private]
    labels:
      finlab.role: gateway
      finlab.gateway: api7
    restart: unless-stopped
networks:
  control:
    external: true
    name: api7-ee_api7
  applications:
    external: true
    name: finlab_default
  legacy_private:
    external: true
    name: finlab_legacy_private
