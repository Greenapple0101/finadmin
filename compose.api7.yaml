# 기존 API7 Control Plane에 연결하는 OAuth 실습용 Gateway입니다.
# 실행: docker compose -f compose.api7.yaml up -d
# 인증 정보·라이선스·Control Plane은 기존 로컬 제품 설치를 사용합니다.
name: finlab-api7
services:
  gateway:
    image: api7/api7-ee-3-gateway:3.10.2
    container_name: finlab-api7-gateway
    env_file: ./.local/api7/gateway.env
    ports: ["127.0.0.1:18090:9080"]
    volumes:
      - ./infra/api7/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./.local/api7/apisix.uid:/usr/local/apisix/conf/apisix.uid
    # 두 Spring은 Mac의 JVM입니다. host.docker.internal로 연결합니다.
    networks: [control]
    labels:
      finlab.role: gateway
      finlab.gateway: api7
    restart: unless-stopped
networks:
  control:
    external: true
    name: api7-ee_api7
