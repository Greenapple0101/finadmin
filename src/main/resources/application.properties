# [이 파일이 하는 일] 앱 이름, 요청을 받을 주소·포트, 신뢰할 토큰의 기준을 정합니다.
# 왼쪽은 설정 이름이고, = 오른쪽은 값입니다. Java 메서드처럼 직접 실행하지 않습니다.
# ${이름:기본값}은 외부 설정에서 이름에 해당하는 값을 찾고, 없으면 기본값을 쓰라는 뜻입니다.

spring.application.name=finadmin

# 포트는 같은 컴퓨터에서 실행 중인 서버를 찾아가는 번호입니다.
# FinAccess의 기본 8080과 겹치지 않도록 이 앱은 8081을 씁니다.
server.port=${SERVER_PORT:8081}

# 기본으로 내 컴퓨터에서만 접속할 수 있게 합니다. JWT 검증과는 별개의 네트워크 설정입니다.
# 나중에 컨테이너에서 실행할 때는 네트워크 구성에 맞춰 SERVER_ADDRESS를 바꿀 수 있습니다.
server.address=${SERVER_ADDRESS:127.0.0.1}

# issuer는 '누가 발급한 토큰을 믿을지'입니다. 토큰 속 iss 값과 정확히 일치해야 합니다.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:18080/realms/finlab}

# JWKS는 서명을 확인할 공개 키 목록입니다. 비밀 키나 사용자 비밀번호가 아닙니다.
# 컨테이너끼리 연결할 때는 이 주소만 내부 주소로 바꿀 수 있습니다. issuer 값은 그대로 유지합니다.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:18080/realms/finlab/protocol/openid-connect/certs}

# audience는 '어느 API에서 쓰도록 발급된 토큰인지'입니다. 다른 앱 전용 토큰을 거절합니다.
finadmin.security.audience=${JWT_AUDIENCE:finadmin-api}

# ITSM의 회사·직원 연결·서비스 요청을 저장하는 독립 DB입니다.
# 비밀번호는 코드에 적지 않고 실행 환경에서 받습니다.
spring.datasource.url=${ITSM_DB_URL:jdbc:postgresql://localhost:5432/finadmin}
spring.datasource.username=${ITSM_DB_USERNAME:finadmin}
spring.datasource.password=${ITSM_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
