# 관리자 API만 제공합니다. UI는 FinAccess에 있습니다.
spring.application.name=finadmin-oauth
server.address=127.0.0.1
server.port=18101

# issuer: 누가 발급한 토큰인지 / audiences: 어느 API를 위한 토큰인지 확인합니다.
# 이번 이동에서는 기존 OAuth 실습 Realm과 audience를 이어 사용합니다.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:18180/realms/oauth-lab
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:18180/realms/oauth-lab/protocol/openid-connect/certs
# audience=oauth-api 조건은 SecurityConfig의 JwtDecoder에서 직접 확인합니다.

# 오류 응답에 Java의 내부 실행 내용이나 예외 메시지를 노출하지 않습니다.
server.error.include-message=never
server.error.include-stacktrace=never
