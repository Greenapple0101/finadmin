# 이 파일은 시작할 때 cn=config 형식으로 변환하는 설정 원본입니다.
# schema는 명부에 적을 수 있는 항목의 종류를 정합니다.
# inetOrgPerson에는 uid(로그인 ID), cn(이름), sn(성), mail 등이 있습니다.
include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
pidfile /run/slapd/slapd.pid
argsfile /run/slapd/slapd.args
modulepath /usr/lib/ldap
moduleload back_mdb

# MDB는 LDAP 데이터를 실제 디스크에 저장하는 방법입니다. PostgreSQL과 별개입니다.
database mdb
maxsize 1073741824
suffix "dc=finlab,dc=com"
rootdn "cn=admin,dc=finlab,dc=com"
# 실제 값은 실행 중에만 넣습니다. Git에는 해시도 넣지 않습니다.
rootpw __ROOT_PASSWORD_HASH__
directory /var/lib/ldap
index objectClass eq
index uid,cn,entryUUID eq
index member eq

# 규칙은 위에서부터 적용됩니다. 비밀번호는 '맞는지 확인(auth)'만 허용하고
# 조회(read)는 허용하지 않습니다. Keycloak도 비밀번호 해시를 가져갈 수 없습니다.
access to attrs=userPassword
    by anonymous auth
    by * none

# cn=keycloak은 직원·그룹을 읽는 서비스 계정입니다. 수정 권한은 없습니다.
# rootdn은 별도의 관리 계정이며 이 제한을 받지 않습니다.
access to *
    by dn.exact="cn=keycloak,ou=services,dc=finlab,dc=com" read
    by * none
