# [이 파일이 하는 일] 들어온 주소를 보고 어느 서버로 보낼지, 먼저 무엇을 검사할지 정합니다.
# 흐름: 브라우저 → APISIX의 JWT 검사 → Spring 백엔드의 JWT 검사 → 업무 코드.
# 백엔드는 Gateway가 보낸 요청이라도 토큰을 스스로 다시 검사합니다.
routes:
  - id: finaccess-api
    # /*는 이 접두사로 시작하는 나머지 주소를 뜻합니다.
    # /access/api/hello도 포함하므로 Gateway를 통한 API 호출에는 모두 토큰이 필요합니다.
    uri: /access/*
    priority: 100
    plugins:
      openid-connect:
        # 로그인하는 프런트의 ID가 아니라, 이 경로가 요구하는 토큰의 대상(aud)입니다.
        client_id: finaccess-api
        # Docker 안의 keycloak은 compose.yaml의 서비스 이름으로 찾습니다.
        discovery: http://keycloak:8080/realms/finlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        unauth_action: deny
        token_signing_alg_values_expected: RS256
        accept_none_alg: false
        accept_unsupported_alg: false
        iat_slack: 0
        # 검증한 액세스 토큰만 Authorization에 넣어 백엔드로 전달합니다.
        # JWKS 공개 키로 검증하는 이 모드에서는 client_secret이 필요하지 않습니다.
        set_access_token_header: true
        access_token_in_authorization_header: true
        set_id_token_header: false
        set_raw_id_token_header: false
        set_userinfo_header: false
        set_refresh_token_header: false
        claim_validator:
          issuer:
            valid_issuers:
              - http://localhost:18080/realms/finlab
          audience:
            claim: aud
            required: true
            match_with_client_id: true
        # 주의: APISIX의 기본 audience 검사 실패 응답은 403입니다.
        # Spring의 audience 검사 실패 401과 다르지만, 둘 다 요청을 차단합니다.

      # APISIX 3.18의 기본 OIDC 검증만으로 nbf 검증을 가정하지 않습니다.
      # rewrite 마지막에 실행하여, OIDC의 서명/발급자/대상 검사가 끝난 토큰의 시간을 추가 검사합니다.
      # 이 함수는 토큰을 읽을 뿐 서명을 검증하지 않습니다. 위 openid-connect를 반드시 함께 둡니다.
      serverless-post-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local header = core.request.header(ctx, "Authorization")
              local token = type(header) == "string"
                and header:match("^Bearer%s+(.+)$")
              local parsed = token and require("resty.jwt"):load_jwt(token)
              local claims = parsed and parsed.valid and parsed.payload
              local now = ngx.time()
              -- exp(만료 시각)는 반드시 있어야 하고, 현재보다 미래여야 합니다.
              local invalid = type(claims) ~= "table"
              if not invalid then
                invalid = type(claims.exp) ~= "number" or claims.exp <= now
                -- nbf(사용 시작 시각)는 있을 때만 검사합니다. 아직 그 시각 전이면 거절합니다.
                if claims.nbf ~= nil then
                  invalid = invalid or type(claims.nbf) ~= "number"
                    or claims.nbf > now
                end
              end
              if invalid then
                ngx.header["WWW-Authenticate"] = 'Bearer error="invalid_token"'
                return 401, {message = "Token time claims are invalid"}
              end
            end

      proxy-rewrite:
        # /access/api/hello → /api/hello: 어느 앱인지 구분한 접두사만 제거합니다.
        regex_uri: ["^/access/(.*)$", "/$1"]
      response-rewrite:
        headers:
          set:
            X-Finlab-Gateway: apisix
            # 이 값은 선택된 경로입니다. 백엔드까지 도착했다는 증명은 아닙니다.
            X-Finlab-Upstream: finaccess
    upstream:
      type: roundrobin
      nodes:
        "finaccess:8080": 1

  - id: finadmin-api
    uri: /admin/*
    priority: 100
    plugins:
      # FinAccess와 같은 검사를 하되, 여기서는 finadmin-api가 대상인 토큰만 받습니다.
      # admin 역할 여부는 FinAdmin의 Spring Security가 실제 API 규칙에 맞춰 검사합니다.
      openid-connect:
        client_id: finadmin-api
        discovery: http://keycloak:8080/realms/finlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        unauth_action: deny
        token_signing_alg_values_expected: RS256
        accept_none_alg: false
        accept_unsupported_alg: false
        iat_slack: 0
        set_access_token_header: true
        access_token_in_authorization_header: true
        set_id_token_header: false
        set_raw_id_token_header: false
        set_userinfo_header: false
        set_refresh_token_header: false
        claim_validator:
          issuer:
            valid_issuers:
              - http://localhost:18080/realms/finlab
          audience:
            claim: aud
            required: true
            match_with_client_id: true
      # 위 OIDC 검증에 덧붙이는 시간 검사입니다. 이 함수만 단독으로 쓰면 안 됩니다.
      serverless-post-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local header = core.request.header(ctx, "Authorization")
              local token = type(header) == "string"
                and header:match("^Bearer%s+(.+)$")
              local parsed = token and require("resty.jwt"):load_jwt(token)
              local claims = parsed and parsed.valid and parsed.payload
              local now = ngx.time()
              local invalid = type(claims) ~= "table"
              if not invalid then
                invalid = type(claims.exp) ~= "number" or claims.exp <= now
                if claims.nbf ~= nil then
                  invalid = invalid or type(claims.nbf) ~= "number"
                    or claims.nbf > now
                end
              end
              if invalid then
                ngx.header["WWW-Authenticate"] = 'Bearer error="invalid_token"'
                return 401, {message = "Token time claims are invalid"}
              end
            end
      proxy-rewrite:
        regex_uri: ["^/admin/(.*)$", "/$1"]
      response-rewrite:
        headers:
          set:
            X-Finlab-Gateway: apisix
            X-Finlab-Upstream: finadmin
    upstream:
      type: roundrobin
      nodes:
        "finadmin:8081": 1

  - id: frontend
    # 로그인 전에도 화면 파일은 받아야 하므로 프런트 경로에는 JWT 검사를 붙이지 않습니다.
    # API 경로는 위의 priority 100 규칙이 먼저 잡습니다.
    uri: /*
    priority: 0
    plugins:
      response-rewrite:
        headers:
          set:
            X-Finlab-Gateway: apisix
    upstream:
      type: roundrobin
      nodes:
        "web:80": 1

# APISIX가 파일을 끝까지 읽었는지 확인하는 표시입니다. 지우면 설정이 적용되지 않습니다.
#END
