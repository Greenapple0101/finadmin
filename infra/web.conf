# 정적 실습 화면만 제공합니다. 알 수 없는 주소에 HTML을 대신 보내지 않고 404로 응답합니다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 로그인 콜백 URL의 일회용 code를 기본 Nginx 접근 로그에 남기지 않습니다.
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:18080; frame-ancestors 'none'; base-uri 'none'" always;
    location / { try_files $uri $uri/ =404; }
}
