// [이 파일이 하는 일] 앱을 만들고 실행하는 데 필요한 도구와 라이브러리를 정합니다.
// Gradle은 이 설정을 읽어 라이브러리를 준비하고 Java 코드를 컴파일합니다.
// 컴파일은 사람이 쓴 Java 코드를 Java 실행 환경이 읽을 수 있는 형태로 바꾸는 일입니다.
// ./gradlew bootRun: 앱 실행 / ./gradlew test: 테스트 / ./gradlew bootJar: 실행 파일 만들기.
// 기존 FinAccess와 같은 버전을 사용해서 두 앱을 같은 환경에서 공부할 수 있게 합니다.

// plugin은 Gradle에 기능을 붙입니다. 아래 세 가지는 Java와 Spring Boot 앱을 만들 때 사용합니다.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

// 앱의 소속과 개발 버전입니다. Java 파일의 package를 바꿔 주는 설정은 아닙니다.
group = 'io.github.greenapple0101'
version = '0.0.1-SNAPSHOT'

// 이 프로젝트를 빌드할 때 Java 21을 사용합니다.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 필요한 라이브러리를 내려받을 저장소입니다.
repositories {
    mavenCentral()
}

// starter는 함께 쓰는 라이브러리를 묶은 것입니다. 업무 기능까지 만들어 주지는 않습니다.
// 버전을 따로 적지 않은 라이브러리는 Spring Boot의 버전 관리 설정을 따릅니다.
dependencies {
    // 웹 서버를 실행하고, HTTP 요청을 Controller에 연결하고, 응답을 JSON으로 보냅니다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // API 앞에서 Bearer 토큰의 서명과 내용을 검사하는 Spring Security 도구입니다.
    // 로그인 화면이나 비밀번호 저장소를 만드는 것이 아닙니다. 로그인은 Keycloak이 맡습니다.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // 아래 도구들은 테스트에서만 씁니다. MockMvc로 요청과 응답을 검사할 수 있습니다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// JUnit 방식으로 작성한 테스트를 찾아 실행합니다.
tasks.named('test') {
    useJUnitPlatform()
}
